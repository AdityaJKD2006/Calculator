<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="answer-display">
            <input class="ip" type="text" placeholder="Answer">
        </div>
        <div class="container">
            <div class="numbers">
                <button id="btn">1</button>
                <button id="btn">2</button>
                <button id="btn">3</button>
                <button id="btn">4</button>
                <button id="btn">5</button>
                <button id="btn">6</button>
                <button id="btn">7</button>
                <button id="btn">8</button>
                <button id="btn">9</button>
                <button id="btn">0</button>
            </div>
            <div class="operators">
                <button id="btn">C</button>
                <button id="btn">+</button>
                <button id="btn">-</button>
                <button id="btn">*</button>
                <button id="btn">/</button>
                <button id="btn">=</button>
            </div>
        </div>
    </main>

    <script src="calculator.js"></script>
</body>
</html>
